services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://mlep:${POSTGRES_PASSWORD:-mlep-dev-password}@db:5432/mlep
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-before-production}
      ADMIN_STATS_TOKEN: ${ADMIN_STATS_TOKEN:-local-admin-token}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      DATA_LAB_URL: ${DATA_LAB_URL:-/cursos}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mlep
      POSTGRES_USER: mlep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlep-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlep -d mlep"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
