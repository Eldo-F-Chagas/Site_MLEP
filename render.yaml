services:
  - type: web
    name: mlep-site
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mlep-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_STATS_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://mlep-site.onrender.com
      - key: DATA_LAB_URL
        value: /cursos

databases:
  - name: mlep-db
    databaseName: mlep
    user: mlep
