# Development Docker Compose Configuration
version: '3.8'

services:
  # MLEP Website Application (Development)
  mlep-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mlep-website-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "3000:3000"  # Vite dev server
    environment:
      - DATABASE_URL=sqlite:///./data/mlep_dev.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATA_LAB_URL=https://example.com/data-lab
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - mlep-dev-network
    command: >
      sh -c "
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload &
        npm run dev -- --host 0.0.0.0 --port 3000
      "

  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:15-alpine
    container_name: mlep-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mlep_dev
      - POSTGRES_USER=mlep_dev
      - POSTGRES_PASSWORD=dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - mlep-dev-network

  # Redis (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: mlep-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - mlep-dev-network

networks:
  mlep-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
